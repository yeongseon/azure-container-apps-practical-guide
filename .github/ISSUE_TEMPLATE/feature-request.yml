name: Feature or Content Request
description: Suggest a new section, guide, lab, workflow, or improvement.
title: "docs: "
labels: []
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Provide a short summary of the request.
      placeholder: Add guidance for Dapr service invocation.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Explain the problem, goal, or gap this request would address.
      placeholder: Readers need...
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution or content
      description: Describe the change you would like to see.
      placeholder: A new page or section covering...
    validations:
      required: false
  - type: textarea
    id: audience
    attributes:
      label: Intended audience or scenario
      description: Describe who would benefit and in what situation.
      placeholder: Platform engineers deploying...
    validations:
      required: false
  - type: textarea
    id: affected-scope
    attributes:
      label: Scope and exclusions
      description: Concrete deliverables, target paths/areas, and what is explicitly out of scope.
      placeholder: Add ... to ...; exclude ...
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Objective outcomes and reviewable artifacts; avoid generic 'looks good' criteria.
      placeholder: - [ ] ...
    validations:
      required: true
  - type: textarea
    id: verification-plan
    attributes:
      label: Verification plan
      description: How the resulting change can be checked and where results should be recorded.
      placeholder: Test or manual review procedure ...
    validations:
      required: true
