name: Documentation Correction
description: Report incorrect, outdated, or unclear documentation.
title: "docs: "
labels: []
body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: Provide a short summary of the documentation problem.
      placeholder: The scaling page links to the wrong article.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Explain what is wrong or unclear and what readers might misunderstand.
      placeholder: Describe the current wording and the problem it causes.
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Affected page or file
      description: Provide the page URL or repository file path.
      placeholder: docs/platform/scaling/overview.md
    validations:
      required: true
  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested correction
      description: Share the correction you expect, if known.
      placeholder: Replace the current sentence with...
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and as-of baseline
      description: Quote/link current incorrect claim with path/line; mark facts, inference and version used.
      placeholder: At commit... this sentence...
    validations:
      required: true
  - type: textarea
    id: affected-scope
    attributes:
      label: Scope and non-goals
      description: Specific page(s) to change and what is deliberately excluded.
      placeholder: Change ...; do not alter ...
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Specific reader-visible correction and source-backed result, not just 'update docs'.
      placeholder: - [ ] ...
    validations:
      required: true
  - type: textarea
    id: verification-plan
    attributes:
      label: Verification plan
      description: Documentation commands, citations, link/render/manual visual checks and evidence to report.
      placeholder: mkdocs build --strict; verify rendered page ...
    validations:
      required: true
