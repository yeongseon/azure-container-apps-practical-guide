name: Application Tests

on:
  pull_request:
    paths:
      - 'apps/java-springboot/**'
      - 'apps/python/**'
      - 'apps/nodejs/**'
      - 'apps/dotnet-aspnetcore/**'
      - 'apps/**/*.sh'
      - 'jobs/**/*.sh'
      - 'labs/**/*.sh'
      - 'labs/**/*.py'
      - 'labs/**/evidence/**'
      - 'scripts/**/*.py'
      - 'scripts/absorbed-predicate-allowlist.txt'
      - 'infra/**/*.sh'
      - 'scripts/**/*.sh'
      - 'apps/**/*.bicep'
      - 'jobs/**/*.bicep'
      - 'labs/**/*.bicep'
      - 'infra/**/*.bicep'
      - '.github/workflows/app-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/java-springboot/**'
      - 'apps/python/**'
      - 'apps/nodejs/**'
      - 'apps/dotnet-aspnetcore/**'
      - 'apps/**/*.sh'
      - 'jobs/**/*.sh'
      - 'labs/**/*.sh'
      - 'labs/**/*.py'
      - 'labs/**/evidence/**'
      - 'scripts/**/*.py'
      - 'scripts/absorbed-predicate-allowlist.txt'
      - 'infra/**/*.sh'
      - 'scripts/**/*.sh'
      - 'apps/**/*.bicep'
      - 'jobs/**/*.bicep'
      - 'labs/**/*.bicep'
      - 'infra/**/*.bicep'
      - '.github/workflows/app-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    name: Shell Scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          find apps jobs labs infra scripts -type f -name '*.sh' -print0 | xargs -0 -r bash -n

      - name: Run ShellCheck (errors block)
        run: |
          find apps jobs labs infra scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck --severity=error

      - name: Report ShellCheck backlog (advisory)
        run: |
          find apps jobs labs infra scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck
        continue-on-error: true  # Lenient: surfaces pre-existing warning/info/style backlog without blocking PRs.

  lab-verifiers:
    name: Lab Evidence Verifiers
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect absorbed strong/fallback gate predicates
        run: |
          python3 -m doctest scripts/detect_absorbed_predicates.py
          python3 scripts/detect_absorbed_predicates.py labs \
            --allowlist scripts/absorbed-predicate-allowlist.txt \
            --repo-root .

      - name: Run replica-node-spread verifier regression suite
        run: python3 labs/replica-node-spread/test_verify.py

      - name: Confirm re-verification reproduces the committed gate JSONs
        run: |
          bash labs/replica-node-spread/verify.sh
          python3 - <<'PY'
          import datetime
          import json
          import pathlib
          import subprocess
          import sys

          GATES = (
              "10-cohort-integrity-gate.json",
              "11-matrix-coherence-gate.json",
              "12-claim-eligibility-gate.json",
              "13-packaging-gate.json",
          )
          STAMP = "evaluated_at_utc"
          EVIDENCE = pathlib.Path("labs/replica-node-spread/evidence")
          failures = []

          for name in GATES:
              path = EVIDENCE / name
              current = json.loads(path.read_text())
              show = subprocess.run(
                  ["git", "show", f"HEAD:{path.as_posix()}"],
                  capture_output=True,
                  text=True,
                  check=False,
              )
              if show.returncode != 0:
                  failures.append(f"{name}: not committed at HEAD, so it cannot be compared")
                  continue
              committed = json.loads(show.stdout)

              stamp = current.pop(STAMP, None)
              committed_stamp = committed.pop(STAMP, None)

              # Both copies are checked on purpose. `current` proves the
              # verifier still emits the field; `committed` proves the
              # published pack carries an honest evaluation timestamp,
              # and it is the only one a reader ever sees.
              for label, value in (("emitted", stamp), ("committed", committed_stamp)):
                  if value is None:
                      failures.append(f"{name}: {label} document has no top-level {STAMP}")
                      continue
                  try:
                      datetime.datetime.strptime(value, "%Y-%m-%dT%H:%M:%SZ")
                  except (TypeError, ValueError):
                      failures.append(
                          f"{name}: {label} {STAMP}={value!r} is not an ISO-8601 UTC timestamp"
                      )

              if current != committed:
                  failures.append(f"{name}: re-verification changed the gate beyond {STAMP}")

          if failures:
              print(
                  "The committed evidence pack no longer matches what the current "
                  "verifier produces:",
                  file=sys.stderr,
              )
              for failure in failures:
                  print(f"  - {failure}", file=sys.stderr)
              sys.exit(1)

          print(f"All {len(GATES)} gate JSONs reproduce exactly, modulo {STAMP}.")
          PY

  bicep:
    name: Bicep Templates
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Bicep templates
        uses: azure/cli@v2
        with:
          inlineScript: |
            find apps jobs labs infra -type f -name '*.bicep' -print | sort | while IFS= read -r file; do
              echo "Building ${file}"
              az bicep build --file "${file}" --stdout >/dev/null
            done

  java-springboot:
    name: Java Spring Boot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven tests
        working-directory: apps/java-springboot
        run: mvn --batch-mode test

  python:
    name: Python (Flask + Gunicorn)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/python/requirements.txt

      - name: Install dependencies
        working-directory: apps/python
        run: pip install --requirement requirements.txt

      - name: Byte-compile sources
        working-directory: apps/python
        run: python -m compileall src

      - name: Health smoke test
        working-directory: apps/python
        env:
          PORT: '8000'
          WEB_CONCURRENCY: '2'
        run: |
          gunicorn --config gunicorn.conf.py --chdir src "app:app" >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "${SERVER_PID}" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/health; then
              echo ""
              echo "Health check passed on attempt ${attempt}."
              exit 0
            fi
            sleep 1
          done

          echo "Health check failed: /health did not return 200 within 30s." >&2
          echo "----- server log -----" >&2
          cat /tmp/server.log >&2 || true
          exit 1

  nodejs:
    name: Node.js (Express)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: apps/nodejs
        run: npm install

      - name: Health smoke test
        working-directory: apps/nodejs
        env:
          PORT: '8000'
        run: |
          npm start >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "${SERVER_PID}" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/health; then
              echo ""
              echo "Health check passed on attempt ${attempt}."
              exit 0
            fi
            sleep 1
          done

          echo "Health check failed: /health did not return 200 within 30s." >&2
          echo "----- server log -----" >&2
          cat /tmp/server.log >&2 || true
          exit 1

  dotnet:
    name: .NET (ASP.NET Core)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build
        working-directory: apps/dotnet-aspnetcore
        run: dotnet build --configuration Release

      - name: Health smoke test
        working-directory: apps/dotnet-aspnetcore
        env:
          PORT: '8000'
        run: |
          dotnet run --configuration Release --no-build >/tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "${SERVER_PID}" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/health; then
              echo ""
              echo "Health check passed on attempt ${attempt}."
              exit 0
            fi
            sleep 1
          done

          echo "Health check failed: /health did not return 200 within 30s." >&2
          echo "----- server log -----" >&2
          cat /tmp/server.log >&2 || true
          exit 1
